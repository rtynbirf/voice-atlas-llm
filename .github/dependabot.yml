# Dependabot: обновления версий зависимостей (pip)
# Доктрина аккаунта: зависимости обновляются автоматически, фиксы — тоже
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
