# Dependabot: обновления версий зависимостей (pip)
# Доктрина аккаунта: зависимости обновляются автоматически, фиксы — тоже
version: 2
updates:
  - package-ecosystem:
    open-pull-requests-limit: 0  # версионный шум Dependabot выключен (чистка аккаунта 2026-11-18) "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
