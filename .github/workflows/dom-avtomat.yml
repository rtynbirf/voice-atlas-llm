name: dom-avtomat
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
permissions:
  contents: read
  actions: read
jobs:
  avtomat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ДОМ-АВТОМАТ · вычисление состояния репо
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 ДОМ/avtomat.py --check
      - name: ДОГОВОР-ФСМ · структурная проверка карточек (там, где канон)
        if: ${{ hashFiles('dogovor_fsm.py') != '' }}
        run: |
          python3 dogovor_fsm.py --selftest
          python3 dogovor_fsm.py --check kartochki
      - name: КВ-ФСМ · самотест автомата проверки утверждений (там, где вкачан)
        if: ${{ hashFiles('ДОМ/claim_verifier_fsm.py') != '' }}
        run: python3 ДОМ/claim_verifier_fsm.py --selftest
