name: CodeQL

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1" # еженедельно, понедельник

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (Python+JS-TS)
    # Code scanning бесплатен для публичных репо (или с GHAS для приватных).
    # Репо станет публичным — анализ включится сам, без правок воркфлоу.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      actions: read # нужен codeql-action для get-a-workflow-run при загрузке SARIF
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: python, javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:javascript"
