name: invariant-witness
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  witness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: СВИДЕТЕЛЬ РОЯ · подпись дерева
        run: |
          mkdir -p witness
          {
            echo "{"
            echo "  \"repo\": \"$GITHUB_REPOSITORY\","
            echo "  \"head\": \"$(git rev-parse HEAD)\","
            echo "  \"tree\": \"$(git rev-parse HEAD^{tree})\","
            echo "  \"utc\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\","
            echo "  \"kernel\": \"rtynbirf/invariant-manifest\","
            echo "  \"правило\": \"НОСИТЕЛЬ СМЕРТЕН = КОММИТ НЕТ\""
            echo "}"
          } > witness/WITNESS.json
          cat witness/WITNESS.json
      - uses: actions/upload-artifact@v7
        with:
          name: invariant-witness
          path: witness/WITNESS.json
