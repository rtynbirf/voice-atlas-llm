# Полное обучение Атлас-LLM v3 (волна «Добивание», MODEL_CARD §3): лечение
# регресса генерации v2 (F1 0.179 < v1 0.211).
# Причина v2: table_qa 53.5% train — стиль авто-таблиц доминирует и смещает адаптер.
# Лечение v3 (data/dataset_v3, build_dataset.py --v3):
#   кэп table_qa 30% (79 пар, 25.7% итог), +22 процедурные QA (этапы гл. 12,
#   эталон-псевдокод), +43 парафраза авто-типов; вал заморожен = вале-30 v2
#   (гл. 9+14, бит-в-байт; A/B честный). Тренировочные главы 9/14 исключены.
# Всё остальное 1:1 с v2: база, LoRA r=16/α=32, lr 2e-4, косинус, max_len 1280,
# 3 эпохи, батч 1×grad_accum 16, load_dtype_cpu bf16, градиент-чекпоинтинг.
# Шаги: 308/16 = 20/эпоху → 60 всего (~50 мин на CPU; окна --resume --max-minutes 7).
# A/B протокол тот же: eval_qa.py --adapter models/atlas-qwen-0.5b-v3
#   --base models/_base/Qwen2.5-0.5B-Instruct --out evaluation/report_v3_on_val30.json
base_model: models/_base/Qwen2.5-0.5B-Instruct
output_dir: models/atlas-qwen-0.5b-v3
system_prompt_file: data/curated/system_prompt.txt
max_len: 1280
allow_gpu: true
bf16: true
gradient_checkpointing: true
seed: 42
load_dtype_cpu: bfloat16
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
data:
  train: data/dataset_v3/train.jsonl
  val: data/dataset_v3/val.jsonl
training:
  epochs: 3
  batch_size: 1
  grad_accum: 16
  lr: 0.0002
  weight_decay: 0.01
  warmup_frac: 0.06
  log_every: 5
  max_grad_norm: 1.0
