# Полное обучение Атлас-LLM v2 (волна «Гибрид»): расширение корпуса 163 → 383.
# База — канонический CPU-порт qwen2.5-0.5b-ru-cpu.yaml; отличия v2:
#   датасет: data/dataset (353 train / 30 val, авто-QA таблиц+законов, сплит по главам)
#   max_len: 640 → 1280  (самый длинный ответ v2 = 1097 знаков ≈ ~450 токенов;
#                         с запасом на system-промпт; drop_long НЕ включён —
#                         если строка не влезает, прогон честно падает)
#   epochs: 4 → 3        (v1: val_loss 2.8305@3 → 2.8237@4 — плато; 3 эпохи честно)
#   всё остальное 1:1: LoRA r=16/alpha=32, 7 модулей, lr 2e-4, косинус,
#   батч 1×grad_accum 16, load_dtype_cpu bf16, градиент-чекпоинтинг.
# Оценка времени (v1 = 121 c/шаг на CPU 2 ядра/4 ГБ): 353×3/16 ≈ 66 шагов ≈ 2.2 ч.
# Запуск:
#   python training/train_lora.py --config training/configs/qwen2.5-0.5b-atlas-v2.yaml
# После: python evaluation/eval_qa.py --adapter models/atlas-qwen-0.5b --out evaluation/report_full.json
base_model: models/_base/Qwen2.5-0.5B-Instruct
output_dir: models/atlas-qwen-0.5b
system_prompt_file: data/curated/system_prompt.txt
max_len: 1280
allow_gpu: true
bf16: true
gradient_checkpointing: true
seed: 42
load_dtype_cpu: bfloat16
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
data:
  train: data/dataset/train.jsonl
  val: data/dataset/val.jsonl
training:
  epochs: 3
  batch_size: 1
  grad_accum: 16
  lr: 0.0002
  weight_decay: 0.01
  warmup_frac: 0.06
  log_every: 5
  max_grad_norm: 1.0
